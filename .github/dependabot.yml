version: 2
updates:
  # ==========================================================================
  # 1. MAVEN CONFIGURATION - DEV BRANCH
  # ==========================================================================
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
      time: "10:30"
      timezone: "Europe/Berlin"
    
    # Specifies the GitHub usernames of individuals requested to review the created PRs
    reviewers:
      - "mastertomspirit"
      
    # Higher limit allowed on dev branch to catch up with fast-paced dependency changes during development
    open-pull-requests-limit: 10

    # Assigns specific organizational tags to the PRs for easier filtering and automated workflows
    labels:
      - "dependencies"
      - "dev-branch"

  # ==========================================================================
  # 2. GITHUB ACTIONS CONFIGURATION
  # ==========================================================================
  - package-ecosystem: "github-actions"
    target-branch: "dev"
    directory: "/"
    schedule:
      interval: "daily"
      time: "10:45"
      timezone: "Europe/Berlin"
    reviewers:
      - "mastertomspirit"
    labels:
      - "dependencies"
      - "github-actions"
